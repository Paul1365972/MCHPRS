[package]
name = "rilc"
authors.workspace = true
description.workspace = true
edition.workspace = true
homepage.workspace = true
keywords.workspace = true
readme.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
include.workspace = true

[features]
fpga = ["dep:mchprs_redpiler_fpga"]

[dependencies]
mchprs_redpiler = { path = "../redpiler" }
mchprs_redpiler_fpga = { path = "../redpiler_fpga", optional = true }
mchprs_save_data = { path = "../save_data" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
toml = { workspace = true }
mchprs_blocks = { path = "../blocks" }
mchprs_world = { path = "../world", features = ["testing"] }
mchprs_schematic = { path = "../schematic" }
line-index = { workspace = true }
clap = { workspace = true }
anstream = { workspace = true }
owo-colors = { workspace = true }
tracing-subscriber = { workspace = true}
