[package]
name = "mchprs_core"
authors.workspace = true
description.workspace = true
edition.workspace = true
homepage.workspace = true
keywords.workspace = true
readme.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
include.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
mchprs_commands = { path = "../commands" }
mchprs_proc_macros = { path = "../proc_macros" }
mchprs_save_data = { path = "../save_data" }
mchprs_blocks = { path = "../blocks", features = ["nbt"] }
mchprs_world = { path = "../world" }
mchprs_network = { path = "../network" }
mchprs_redpiler = { path = "../redpiler" }
mchprs_redpiler_direct = { path = "../redpiler_direct" }
mchprs_worker = { path = "../worker" }
mchprs_redstone = { path = "../redstone" }
mchprs_schematic = { path = "../schematic" }
toml = { workspace = true }
byteorder = { workspace = true }
hematite-nbt = { workspace = true }
bitflags = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
md5 = { workspace = true }
bus = { workspace = true }
ctrlc = { workspace = true, features = ["termination"] }
tracing = { workspace = true }
rand = { workspace = true }
backtrace = { workspace = true }
rusqlite = { workspace = true, features=["bundled"] }
anyhow = { workspace = true }
toml_edit = { workspace = true }
ureq = { workspace = true, features = ["json"], optional = true }
itertools = { workspace = true }
bincode = { workspace = true }
rustc-hash = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
regex = { workspace = true }
thiserror = { workspace = true }

[features]
whitelist = ["dep:ureq"]
